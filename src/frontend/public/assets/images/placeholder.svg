<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none" role="img"
  aria-label="Warm sepia initials placeholder portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e7d3" />
      <stop offset="100%" stop-color="#e6d3b8" />
    </linearGradient>

    <linearGradient id="card" x1="300" y1="120" x2="900" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf8ef" />
      <stop offset="100%" stop-color="#f7eeda" />
    </linearGradient>

    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(240 140) rotate(20) scale(280 220)">
      <stop stop-color="#c9a06b" stop-opacity="0.35" />
      <stop offset="1" stop-color="#c9a06b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(980 500) rotate(-10) scale(320 240)">
      <stop stop-color="#a8b8c4" stop-opacity="0.32" />
      <stop offset="1" stop-color="#a8b8c4" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="220" y="60" width="760" height="500" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#6b4f2e" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)" />
  <rect width="1200" height="600" fill="url(#glow1)" />
  <rect width="1200" height="600" fill="url(#glow2)" />

  <g filter="url(#shadow)">
    <rect x="300" y="120" width="600" height="360" rx="28" fill="url(#card)" />
    <rect x="300.5" y="120.5" width="599" height="359" rx="27.5" stroke="#d8c4a0" stroke-opacity="0.8" />
  </g>

  <rect x="340" y="160" width="520" height="220" rx="20" fill="#efe2c8" />
  <rect x="340.5" y="160.5" width="519" height="219" rx="19.5" stroke="#dcc9a6" />

  <!-- Warm sepia portrait silhouette -->
  <path
    d="M390 340L500 245C512 235 529 236 539 248L605 327C615 339 633 340 644 329L713 262C724 251 742 250 754 260L810 310V340H390Z"
    fill="#b08a5a" fill-opacity="0.9" />
  <circle cx="465" cy="225" r="28" fill="#d9b98a" />

  <!-- Initials monogram -->
  <g opacity="0.9">
    <circle cx="600" cy="290" r="54" fill="#fdf8ef" />
    <circle cx="600" cy="290" r="53" stroke="#d8c4a0" />
    <text x="600" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="64" font-weight="600" fill="#7a5c33">N</text>
  </g>

  <rect x="430" y="414" width="340" height="20" rx="10" fill="#a98a5c" />
  <rect x="500" y="448" width="200" height="14" rx="7" fill="#cbb48a" />

  <circle cx="180" cy="470" r="6" fill="#c9a06b" opacity="0.45" />
  <circle cx="1030" cy="130" r="8" fill="#a8b8c4" opacity="0.4" />
  <circle cx="1080" cy="190" r="4" fill="#cbb48a" opacity="0.35" />
</svg>
